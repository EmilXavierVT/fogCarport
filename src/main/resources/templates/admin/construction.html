<head th:replace="~{admin_fragments :: head(~{::construction})}"><title>Konstruktion af Kunde-carport</title></head>
<header th:replace="~{fragments :: header}"></header>
<body>

<section class="Construction"> </section>
<h1>Konstruktion</h1>
<div class="input_container">
    <button class="tab active" data-target="quick_build_section"> Quick-Byg</button>
    <button class="tab" data-target="itemList_section"> Stykliste</button>
    <button class="tab " data-target="drawing_section"> Tegning</button>
    <button class="tab " data-target="customer_receipt_section"> Kunde-kvittering</button>
    <button class="tab " data-target="customer_email_section"> Kunde-Email</button>
</div>

<form th:action="@{/admin/update_request}" method="POST">
<section id="quick_build_section" class="tab_content active">
<div class="quick_build_container">
    <h1>Quick-Byg</h1>
    <div class="flat_section_container_admin">
        <div class="flat_section_container_header">
        <h2>Carport dimensioner</h2>
            <div class="flat_section_container_boxes">
    <div class="flat_section_container_construction">
        <form class="user_defined_form"></form>
        <label for="width"><h3>Bredde</h3></label>
        <select id="width" name="width" th:required="true"  >
        <option th:value="${carport_request.carport.specification.width}" th:text="${carport_request.carport.specification.width}">0</option>
        <option value="0">0</option>
        <option value="300">300</option>
        <option value="360">360</option>
        <option value="420">420</option>
        <option value="480">480</option>
        <option value="540">540</option>
        <option value="600">600</option>
    </select>
        <label for="length"><h3>Længde</h3></label>
        <select id="length" name="length"  th:required="true">
        <option th:value="${carport_request.carport.specification.length}" th:text="${carport_request.carport.specification.length}">0</option>
        <option value="1">0</option>
        <option value="300">300</option>
        <option value="360">360</option>
        <option value="420">420</option>
        <option value="480">480</option>
        <option value="540">540</option>
        <option value="600">600</option>
        <option value="660">660</option>
        <option value="720">720</option>
        <option value="780">780</option>
    </select>

    </div>
        <div class="flat_section_container_construction">
            <label for="shed"></label> <h3>Redskabskur</h3>
            <select name="shed" id="shed" th:required="true">
                <option th:text="${carport_request.carport.specification.shed == true ? 'Med Skur' : 'Uden Skur' }"></option>
                <option value="0">Uden Skur</option>
                <option value="1">Med Skur</option>
        </select>
            <label for="shed_width"><h3>Redskabsrum bredde</h3></label>
            <select name="shed_width" id="shed_width">
                <option th:value="${carport_request.carport.specification.shedWidth}" th:text="${carport_request.carport.specification.shedWidth}">0</option>
                <option value="0">0</option>
                <option value="300">300</option>
                <option value="360">360</option>
                <option value="420">420</option>
                <option value="480">480</option>
                <option value="540">540</option>
                <option value="600">600</option>
        </select>
            <label for="shed_length"><h3>Redskabsrum længde</h3></label>
            <select name="shed_length" id="shed_length">
                <option th:value="${carport_request.carport.specification.shedDepth}" th:text="${carport_request.carport.specification.shedDepth}">0</option>
            <option value="0">0</option>
            <option value="300">300</option>
            <option value="360">360</option>
            <option value="420">420</option>
            <option value="480">480</option>
            <option value="540">540</option>
            <option value="600">600</option>
            <option value="660">660</option>
            <option value="720">720</option>
            <option value="780">780</option>
        </select>
             </div>
    </div>
    </div>
    </div>


<div class="flat_section_container_admin">
    <div class="flat_section_container_header">
    <h2>Tag</h2>
        <div class= "flat_section_container_boxes">
    <div class="flat_section_container_construction">
        <label for="roof"></label> <h3>Carport trapeztag</h3>
        <select name="roof" id="roof"th:required="true">
        <option value="29">Ingen tag</option>
        <option value="6">Plast tag</option>
    </select>
        <label for="roof_angle"><h3>Grader ved rejsning</h3></label>
        <select name="roof_angle" id="roof_angle" th:required="true">
        <option value="0">0</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
    </select>
        </div>
            <div class="flat_section_container_construction">
                <label for="rafter_type"><h3>Materialer</h3></label>
                <select id="rafter_type" name="rafter_type" th:required="true">
                    <option value="1">Færdige spær (dyre)</option>
                    <option value="2">Byg-selv-spær (billige)</option>
                </select>
            </div>
</div>
    </div>
</div>

    <button type="submit">Opdater Database</button>
</div>
</section>
</form>

    <section id="itemList_section" class="tab_content">
        <h2>Forespørgsler</h2>
        <div class="table_container">
            <table id="itemList" class="dashboard_table">
                <thead>
                <tr>
                    <th>Antal</th>
                    <th>Varenummer</th>
                    <th>Vare Navn</th>
                    <th>Hjælpe Tekst</th>
                    <th>Dimensioner</th>
                    <th>Længde</th>
                    <th>Pris</th>
                </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${item_list}">
                    <td th:text="${item.amount}"></td>
                    <td th:text="${item.product.productID}"></td>
                    <td th:text="${item.product.name}"></td>
                    <td th:text="${item.product.description}"></td>
                    <td th:text="${item.product.dimensions}"></td>
                    <td th:text="${item.length}"></td>
                    <td th:text="${item.product.price} + ' DKK'"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(item_list)}">
                    <td colspan="10">Ingen produkter fundet</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="price_container">
            <div>
            <h2>Kost Pris: <span th:text="${cost_price} + ' DKK'"></span></h2>
            <h2>Tilbuds Pris: <span th:text="${actual_offer} + ' DKK'"></span></h2>
            </div>
            <div>
                <form th:action="@{/update_offer_price}" method="post">
                <input type="hidden" />
                    <label>
                        <input name="markup_percentage" class="input_markup_percentage" type="number" min="20" max="99" placeholder="Ændre pris" required />
                    </label>
                    <button class="button_white" type="submit">dækningsgrad</button>
            </form>
            </div>
        </div>
    </section>

<section id="drawing_section" class="tab_content">
<div class="carport-svg-topview">
    <div class="svg_construction" th:utext="${svg}"> </div>
</div>
</section>

<section id="customer_receipt_section" class="tab_content">

</section>

<section id="customer_email_section" class="tab_content">
    <div class="quick_build_container">
        <h1>Kunde E-mail</h1>
        <div class="flat_section_container_header">
            <h2>E-mail indhold</h2>
            <div class="flat_section_container_boxes">
                <div class="flat_section_container_construction">
                    <form class="user_defined_form" th:action="@{/admin/construction}" method="post">
                        <label for="email_subject">
                            <h3>Email Emne</h3> Omhandlende Carport </label>
                        <input type="text" id="email_subject" name="email_subject" required />
                        <label for="email_body">
                            <h3>Email Indhold</h3>
                        </label>
                        <textarea id="email_body" name="email_body" rows="30" cols="100" required>
Hej (indsæt brugernavn)


Dbh.
                </textarea>

                        <button type="submit">Send Email</button>
                    </form>
                    <form th:action="@{/send_acceptance_offer}" method="post">
                        <button type="submit">Send Tilbud</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="/js/script.js"></script>
</body>
<footer th:replace="~{fragments :: footer}"></footer>
