<head th:replace="~{fragments :: head(~{::index})}"><title>Forside</title></head>
<header th:replace="~{fragments :: header}"></header>
<body>
<section>
<video class="video_container" loop autoplay muted>
<source th:src="@{/videos/cover_video.mp4}">
Din browser understøtter ikke videoer.
</video>
    <img class="cover_video_img" th:src="@{/images/cover_object.png}" alt="cover image" >
</section>


<section id="carport_section" class="carport_slider_section">
    <div class="slider_container">
        <div class="slider">
            <div class="product_card_slider" th:each="carport : ${standard_carports}"
                 th:value="${carport.carportID}">
                <a class="product_card_link" th:href="@{'product/' + ${carport.carportID}}">
                <img th:src="@{'/images/' + ${carport.carportID} + 'carport.png'}" alt="Carport Billede">
                <h3 th:text="${carport.name}"></h3>
                <p th:text="${carport.productionDescription}"></p>
                <span class="slider_product_price" th:text="${carport.price} + ' kr.'"></span>
                <a class="slider_view_button" th:href="@{'product/' + ${carport.carportID}}">
                    SE PRODUKT
                </a>
                </a>
            </div>
        </div>
    </div>
</section>

<section id="login_section" class="login_section">
    <div class="display_container_vertical">
        <h1 class="white_text">Log ind</h1>
        <p class="white_text">Log ind med din Email adresse</p>
        <form class="login_form" th:action="@{/login}" method="POST">
            <label for="email" hidden>e-mail:</label>
            <input class="input_no_border_white" type="email" id="email" name="email" placeholder="Email Adresse" required />
            <label for="password" hidden>Adgangskode:</label>
            <input class="input_no_border_white" type="password" id="password" name="password" placeholder="Adgangskode" required />

            <div class="button_row">
                <button class="button_white" type="submit">Log ind</button>
                <a class="button_white_non_button" th:href="@{/register_password}">Opret dig</a>
            </div>
        </form>
        <p th:if="${session.error_login != null}" th:text="${session.error_login}" style="color: red; font-weight: bold"></p>
    </div>
</section>

</body>
<footer th:replace="~{fragments :: footer}"></footer>
