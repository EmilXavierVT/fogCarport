<head th:replace="~{fragments :: head(~{::login})}"><title>Log ind</title>
<title>Log ind</title>
</head>
<header th:replace="~{fragments :: header}"></header>
<body>
<main>
    <section id="login_section" class="login_section">
        <div class="display_container_vertical">
            <h1 class="white_text">Log ind</h1>
            <p class="white_text">Log ind med din Email adresse</p>
            <form class="login_form" th:action="@{/login}" method="POST">
                <input type="hidden" name="request_id" th:text="${request_id}"/>
                <label for="email" hidden>e-mail:</label>
                <input class="input_no_border_white" type="email" id="email" name="email" placeholder="Email Adresse" required />
                <label for="password" hidden>Adgangskode:</label>
                <input class="input_no_border_white" type="password" id="password" name="password" placeholder="Adgangskode" required />
                <div class="button_row">
                    <button class="button_white" type="submit">Log ind</button>
                    <a class="button_white_non_button" th:href="@{/register_password}">Opret dig</a>
                </div>
            </form>
            <p th:if="${session.error_login != null}" th:text="${session.error_login}" style="color: red; font-weight: bold"></p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
